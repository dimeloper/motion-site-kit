# Docs is the live demo: a reskin of template/ whose content is this repo's README.
# Examples stay in the repo for local serving; they are not in this publish dir.
[build]
  publish = "docs"
  command = ""

[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
