<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiln Carry - One bag for a two-night trip.</title>
  <meta name="description" content="A 32-litre carry-on that holds a jacket, two outfits, and a laptop without a second bag." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="preload" as="image" href="../../frames/960/webp/0039.webp" fetchpriority="high" />
  <link rel="stylesheet" href="src/styles.css" />

  <!--
    Zero-build setup: an import map against a CDN, so the template runs from any
    static host with no toolchain. To move to npm + a bundler, delete this block,
    run `npm i lenis gsap`, and point your bundler at src/motion.js.
  -->
  <script type="importmap">
  {
    "imports": {
      "lenis": "https://esm.sh/lenis@1.3.26",
      "gsap": "https://esm.sh/gsap@3.15.0",
      "gsap/ScrollTrigger": "https://esm.sh/gsap@3.15.0/ScrollTrigger"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <!--
    The hero renders complete without JavaScript. The poster is a real <img> so
    it is the LCP element; if the canvas were the LCP candidate, LCP would be
    measured at the end of preload, scoring a page that felt instant as slow.
  -->
  <!--
    Initial state is `static`: poster only, no loader. The loader appears only
    once motion.js has confirmed it is going to run. If JavaScript is disabled,
    or the module fails to load, the visitor gets a finished hero rather than a
    progress bar that never fills.
  -->
  <header class="hero" data-hero data-motion="static" id="top">
    <img class="hero__poster" src="../../frames/960/webp/0039.webp" alt="" fetchpriority="high" decoding="async" />
    <canvas class="hero__canvas" data-canvas aria-hidden="true"></canvas>
    <div class="hero__grain" aria-hidden="true"></div>
    <div class="hero__vignette" aria-hidden="true"></div>

    <div class="hero__copy">
      <p class="hero__eyebrow" data-bind="hero.eyebrow"></p>
      <h1 class="hero__headline" data-bind="hero.headline"></h1>
      <p class="hero__sub" data-bind="hero.sub"></p>
      <a class="button" data-bind-href="hero.cta.href" data-bind="hero.cta.label"></a>
      <p class="visually-hidden" data-bind="hero.animationDescription"></p>
    </div>

    <div class="loader" data-loader>
      <div class="loader__bar" data-loader-bar></div>
      <p class="loader__label">Loading</p>
    </div>

    <div class="hero__scroll-hint" aria-hidden="true">Scroll</div>
  </header>

  <main id="content">
    <!-- Sections are real HTML at a visible resting state. If they only existed
         to be revealed by GSAP, they would vanish with JavaScript disabled. -->
    <div class="sections" data-sections></div>

    <section class="cta" id="cta">
      <h2 data-bind="cta.title"></h2>
      <p data-bind="cta.body"></p>
      <a class="button button--large" data-bind-href="cta.href" data-bind="cta.label"></a>
    </section>
  </main>

  <div class="progress" aria-hidden="true"></div>

  <script type="module" src="src/bind.js"></script>
  <script type="module" src="src/motion.js"></script>
</body>
</html>
