<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>hero clip</title>
  <style>
    html, body { margin: 0; background: #12150f; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.170.0",
      "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const width = Number(params.get('w') || 1600);
const height = Number(params.get('h') || 900);
const count = Number(params.get('count') || 120);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(width, height);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12150f);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const camera = new THREE.PerspectiveCamera(28, width / height, 0.1, 40);

const key = new THREE.DirectionalLight(0xf4f0e6, 2.6);
key.position.set(3.8, 6.2, 4.0);
scene.add(key);

const rim = new THREE.DirectionalLight(0x3f8f6a, 1.35);
rim.position.set(-5.2, 2.4, -3.2);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0xb8b4aa, 0x12150f, 0.32));

const titanium = () => new THREE.MeshPhysicalMaterial({
  color: 0x9b968f,
  metalness: 0.96,
  roughness: 0.28,
  clearcoat: 0.35,
  clearcoatRoughness: 0.22,
});

const glassBack = new THREE.MeshPhysicalMaterial({
  color: 0x2a2826,
  metalness: 0.15,
  roughness: 0.22,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
});

const glassScreen = new THREE.MeshPhysicalMaterial({
  color: 0x070708,
  metalness: 0.05,
  roughness: 0.06,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
});

const lensGlass = new THREE.MeshPhysicalMaterial({
  color: 0x12141a,
  metalness: 0.2,
  roughness: 0.05,
  transmission: 0.22,
  thickness: 0.25,
  ior: 1.5,
});

const W = 1.18;
const L = 2.42;
const T = 0.11;
const R = 0.16;

const device = new THREE.Group();
device.rotation.y = 0.38;
scene.add(device);

const chassis = new THREE.Mesh(new RoundedBoxGeometry(W, T, L, 6, R), titanium());
device.add(chassis);

const action = new THREE.Mesh(
  new RoundedBoxGeometry(0.018, 0.07, 0.16, 2, 0.006),
  titanium(),
);
action.position.set(W / 2 + 0.008, 0.01, -0.55);
chassis.add(action);

const volume = new THREE.Mesh(
  new RoundedBoxGeometry(0.018, 0.05, 0.38, 2, 0.006),
  titanium(),
);
volume.position.set(W / 2 + 0.008, 0.01, 0.15);
chassis.add(volume);

const power = new THREE.Mesh(
  new RoundedBoxGeometry(0.018, 0.05, 0.22, 2, 0.006),
  titanium(),
);
power.position.set(-W / 2 - 0.008, 0.01, -0.2);
chassis.add(power);

const screen = new THREE.Mesh(new RoundedBoxGeometry(W - 0.06, 0.018, L - 0.06, 6, R - 0.03), glassScreen);
screen.position.y = -T / 2 + 0.004;
device.add(screen);

const island = new THREE.Mesh(
  new RoundedBoxGeometry(0.42, 0.012, 0.1, 4, 0.05),
  new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.2 }),
);
island.position.set(0, 0.01, -L / 2 + 0.22);
screen.add(island);

const back = new THREE.Mesh(new RoundedBoxGeometry(W - 0.05, 0.018, L - 0.05, 6, R - 0.03), glassBack);
back.position.y = T / 2 - 0.004;
device.add(back);

const battery = new THREE.Mesh(
  new RoundedBoxGeometry(W - 0.22, 0.045, L - 0.55, 4, 0.06),
  new THREE.MeshPhysicalMaterial({
    color: 0xddd6c8,
    metalness: 0.35,
    roughness: 0.4,
  }),
);
battery.position.set(0, 0.0, 0.12);
device.add(battery);

const board = new THREE.Mesh(
  new THREE.BoxGeometry(W - 0.28, 0.03, 0.72),
  new THREE.MeshPhysicalMaterial({ color: 0x173328, metalness: 0.25, roughness: 0.42 }),
);
board.position.set(0, 0.012, -0.72);
device.add(board);

const chip = new THREE.Mesh(
  new THREE.BoxGeometry(0.34, 0.04, 0.34),
  new THREE.MeshPhysicalMaterial({ color: 0x1a1c1a, metalness: 0.4, roughness: 0.35 }),
);
chip.position.set(-0.12, 0.035, 0.02);
board.add(chip);

const bump = new THREE.Group();
bump.position.set(-0.28, T / 2 + 0.028, -0.78);
device.add(bump);

const plateau = new THREE.Mesh(
  new RoundedBoxGeometry(0.64, 0.05, 0.64, 5, 0.14),
  glassBack,
);
bump.add(plateau);

function lens(x, z, r) {
  const group = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.02, 40), titanium());
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.72, r * 0.72, 0.024, 40), lensGlass);
  ring.position.y = 0.03;
  glass.position.y = 0.034;
  group.add(ring, glass);
  group.position.set(x, 0, z);
  bump.add(group);
}

lens(-0.13, -0.13, 0.125);
lens(0.13, -0.13, 0.125);
lens(-0.13, 0.13, 0.125);

const flash = new THREE.Mesh(
  new THREE.CylinderGeometry(0.045, 0.045, 0.016, 24),
  new THREE.MeshPhysicalMaterial({
    color: 0xf2ead2,
    emissive: 0xf2ead2,
    emissiveIntensity: 0.4,
    roughness: 0.2,
  }),
);
flash.position.set(0.13, 0.032, 0.13);
bump.add(flash);

window.renderFrame = (index) => {
  const t = count <= 1 ? 0 : index / (count - 1);
  const explode = Math.sin(t * Math.PI);

  screen.position.y = -T / 2 + 0.004 - 0.42 * explode;
  chassis.position.y = -0.06 * explode;
  battery.position.y = 0.32 * explode;
  board.position.y = 0.012 + 0.62 * explode;
  back.position.y = T / 2 - 0.004 + 1.05 * explode;
  bump.position.y = T / 2 + 0.028 + 1.55 * explode;

  const yaw = 0.55 + t * 0.4;
  const radius = 3.55;
  camera.position.set(
    Math.sin(yaw) * radius,
    4.55 + 0.55 * explode,
    Math.cos(yaw) * radius,
  );
  camera.lookAt(0, 0.12 + 0.5 * explode, 0);
  renderer.render(scene, camera);
};

window.renderFrame(0);
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
